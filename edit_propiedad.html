{% extends "base.html" %} {% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">Editar Propiedad</h2>
                    <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título</label>
                        <input type="text" name="titulo" class="form-control" value="{{ propiedad.titulo }}" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Operación</label>
                            <select name="operacion" class="form-select">
                                <option value="Venta" {% if propiedad.operacion == 'Venta' %}selected{% endif %}>Venta</option>
                                <option value="Arriendo" {% if propiedad.operacion == 'Arriendo' %}selected{% endif %}>Arriendo</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Precio</label>
                            <input type="text" name="precio" class="form-control" value="{{ propiedad.precio }}">
                        </div>
                    </div>

                    <hr>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Galería Actual</label>
                        <div class="d-flex flex-wrap gap-2">
                            {% for img in propiedad.imagenes %}
                            <div class="position-relative">
                                <img src="{{ url_for('static', filename=img.ruta) }}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
                                <button type="submit" form="delete-foto-{{ img.id }}" class="btn btn-danger btn-sm position-absolute top-0 end-0 p-1" style="line-height: 1;">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Añadir más fotos a la galería</label>
                        <input type="file" name="galeria_archivos" class="form-control" multiple accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold">GUARDAR CAMBIOS</button>
                </form>

                {% for img in propiedad.imagenes %}
                <form id="delete-foto-{{ img.id }}" action="{{ url_for('delete_foto', id=img.id) }}" method="POST"></form>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
